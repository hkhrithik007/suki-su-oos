name: Build Pong with SukiSU Ultra (no SUSFS)

on:
  workflow_dispatch:
    inputs:
      kernel_defconfig:
        description: "Starting kernel config"
        required: true
        default: "gki_defconfig"
        type: string
      publish_release:
        description: "Publish kernel.zip on GitHub Releases"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Check out the kernel fork
        uses: actions/checkout@v4
        with:
          ref: sm8475/b/mr
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential clang-12 cpio flex \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            libelf-dev libssl-dev lld-12 llvm-12 \
            python3 zip

      - name: Add LLVM 12 tools to PATH
        run: echo "/usr/lib/llvm-12/bin" >> "$GITHUB_PATH"

      - name: Add SukiSU Ultra builtin without SUSFS
        run: |
          set -euo pipefail

          curl -LSs \
            https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh \
            | bash -s builtin

          # Remove SukiSU's optional SUSFS calls and header include.
          sed -i '\|#include <linux/susfs.h>|d' \
            drivers/kernelsu/kernel_includes.h
          sed -i '/susfs_parse_priority_app_strings();/d' \
            drivers/kernelsu/manager/pkg_observer.c
          sed -i '/susfs_set_priority_uid_filter(arg);/d' \
            drivers/kernelsu/supercall/dispatch.c

          # Confirm no SUSFS references remain in the SukiSU source.
          if grep -RIn 'susfs_' drivers/kernelsu \
              --include='*.c' --include='*.h'; then
            echo "::error::SUSFS references remain in SukiSU source."
            exit 1
          fi

          git -C drivers/kernelsu rev-parse HEAD | tee /tmp/sukisu-commit

      - name: Configure kernel
        env:
          KERNEL_DEFCONFIG: ${{ inputs.kernel_defconfig }}
        run: |
          set -euo pipefail

          test -f "arch/arm64/configs/$KERNEL_DEFCONFIG" || {
            echo "::error::Config not found: arch/arm64/configs/$KERNEL_DEFCONFIG"
            exit 1
          }

          make O=out ARCH=arm64 LLVM=-12 "$KERNEL_DEFCONFIG"

          scripts/config --file out/.config \
            --enable CONFIG_KSU \
            --enable CONFIG_KSU_HACK_ARM64_BRANCH_LINK \
            --enable CONFIG_KALLSYMS \
            --enable CONFIG_KALLSYMS_ALL \
            --enable CONFIG_KPROBES \
            --enable CONFIG_KRETPROBES

          make O=out ARCH=arm64 LLVM=-12 olddefconfig

          grep -q '^CONFIG_KSU=y$' out/.config || {
            echo "::error::CONFIG_KSU is not enabled"
            exit 1
          }

      - name: Build kernel
        run: |
          set -euo pipefail

          make -j"$(nproc)" O=out ARCH=arm64 LLVM=-12 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            Image.gz dtbs modules

      - name: Package build outputs
        env:
          KERNEL_DEFCONFIG: ${{ inputs.kernel_defconfig }}
        run: |
          set -euo pipefail

          mkdir -p package/dtb
          test -f out/arch/arm64/boot/Image.gz
          cp out/arch/arm64/boot/Image.gz package/
          cp out/.config package/kernel.config

          if [ -d out/arch/arm64/boot/dts ]; then
            find out/arch/arm64/boot/dts -type f -name '*.dtb' \
              -exec cp --parents '{}' package/dtb/ \;
          fi

          {
            echo "Device: Nothing Phone (2), Pong"
            echo "Kernel branch: sm8475/b/mr"
            echo "Kernel commit: $(git rev-parse HEAD)"
            echo "Defconfig: $KERNEL_DEFCONFIG"
            echo "SukiSU commit: $(cat /tmp/sukisu-commit)"
            echo "SUSFS: disabled"
          } > package/BUILD-MANIFEST.txt

          cd package
          zip -r ../kernel.zip .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pong-kernel-${{ github.run_number }}
          path: kernel.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "Pong kernel build ${{ github.run_number }}"
          generate_release_notes: true
          files: kernel.zip
